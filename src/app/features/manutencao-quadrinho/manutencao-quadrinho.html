<section class="pagina-base">
  <a class="voltar" routerLink="/admin">← Voltar ao Admin</a>
  <header class="manutencao-cabecalho">
    <div>
      <span class="etiqueta">Administração</span>
      <h1>{{ editingQuadrinhoId ? 'Editar quadrinho' : 'Novo quadrinho' }}</h1>
      <p>Preencha as informações da obra para salvar no acervo.</p>
    </div>
  </header>

  @if (loadingData) {
    <p role="status">Carregando dados do quadrinho...</p>
  }
  @if (errorMessage) {
    <p role="alert">{{ errorMessage }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <fieldset [disabled]="loading || loadingData">
      <legend>Dados do quadrinho</legend>
      <p>
        <label for="titulo">Título (mínimo de 3 caracteres)</label>
        <input id="titulo" type="text" formControlName="titulo" required minlength="3" />
      </p>
      <p>
        <label for="autor">Autor (mínimo de 15 caracteres)</label>
        <input id="autor" type="text" formControlName="autor" required minlength="15" />
      </p>
      <p>
        <label for="icone">Ícone</label>
        <input id="icone" type="text" formControlName="icone" required />
      </p>
      <p>
        <label for="editora">Editora (mínimo de 20 caracteres)</label>
        <input id="editora" type="text" formControlName="editora" required minlength="20" />
      </p>
      <p>
        <label for="genero">Gênero (mínimo de 15 caracteres)</label>
        <input id="genero" type="text" formControlName="genero" required minlength="15" />
      </p>
      <p>
        <label for="ano">Ano</label>
        <input id="ano" type="text" formControlName="ano" required />
      </p>
      <p>
        <label for="preco">Preço</label>
        <input id="preco" type="number" formControlName="preco" required min="0" step="0.01" />
      </p>
      <p>
        <label for="volume">Volume</label>
        <input id="volume" type="number" formControlName="volume" />
      </p>
      <p>
        <label for="dataPublicacao">Data de publicação</label>
        <input id="dataPublicacao" type="date" formControlName="dataPublicacao" />
      </p>
      <p>
        <label for="disponivel">
          <input id="disponivel" type="checkbox" formControlName="disponivel" />
          Disponível
        </label>
      </p>
      <button type="submit">{{ loading ? 'Salvando...' : 'Salvar quadrinho' }}</button>
    </fieldset>
  </form>
</section>

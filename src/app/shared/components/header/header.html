<header class="cabecalho">
  <div class="cabecalho-conteudo">
    <a class="marca" routerLink="/" aria-label="ComicVerse — início">
      <span class="marca-simbolo" aria-hidden="true">C</span>
      <span>ComicVerse</span>
    </a>
    <nav aria-label="Menu principal">
      <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a routerLink="/quadrinhos" routerLinkActive="ativo">Catálogo</a>
      <a routerLink="/sobre" routerLinkActive="ativo">Sobre</a>
      <a class="botao-admin" routerLink="/admin" routerLinkActive="ativo">Admin</a>
      <button
        class="botao-tema"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-pressed]="isDarkMode()"
        [attr.aria-label]="isDarkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'"
        [title]="isDarkMode() ? 'Ativar modo claro' : 'Ativar modo escuro'"
      >
        <span aria-hidden="true">{{ isDarkMode() ? '☀' : '☾' }}</span>
        <span class="texto-tema">{{ isDarkMode() ? 'Claro' : 'Escuro' }}</span>
      </button>
    </nav>
  </div>
</header>
